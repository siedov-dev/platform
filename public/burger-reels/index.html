<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Happy Burger Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140b07; }
  body {
    font-family: "Cinzel", "Times New Roman", serif;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(255, 170, 60, 0.18), transparent 60%),
      radial-gradient(80% 60% at 50% 100%, rgba(255, 120, 40, 0.14), transparent 70%),
      linear-gradient(180deg, #2a160c 0%, #140b07 55%, #0c0604 100%);
    color: #f3dc9a;
  }
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 390px;
    height: 800px;
    transform-origin: 0 0;
  }
  .art { position: absolute; z-index: 1; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  #gl { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; }
  .over { position: absolute; z-index: 3; pointer-events: none; user-select: none; }
  .ui { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  .plus {
    position: absolute;
    width: 44px;
    height: 26px;
    line-height: 26px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    pointer-events: auto;
    font-family: "Cinzel", serif;
    font-size: 13px;
    font-weight: 900;
    color: #fff6d2;
    text-shadow: 0 1px 0 #3a2300;
    background: linear-gradient(180deg, #ffe9a6 0%, #e2b451 40%, #a8731c 100%);
    box-shadow: 0 0 0 1.5px #5a3708, inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 3px 8px rgba(0, 0, 0, 0.6);
  }
  .plus:active { transform: scale(0.94); }
  #spin {
    position: absolute;
    left: 115px;
    top: 712px;
    width: 160px;
    height: 50px;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    pointer-events: auto;
    z-index: 5;
    font-family: "Cinzel", serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #fff6d2;
    text-shadow: 0 2px 0 #0b3a24, 0 3px 6px rgba(0, 0, 0, 0.6);
    background: linear-gradient(180deg, #6fe39a 0%, #22a95c 45%, #0f6b3a 100%);
    box-shadow: 0 0 0 3px #f2cf6a, 0 0 0 5px #5a3708, inset 0 2px 0 rgba(255, 255, 255, 0.45), 0 6px 16px rgba(0, 0, 0, 0.6), 0 0 18px rgba(90, 230, 150, 0.35);
    transition: transform 0.1s;
  }
  #spin:active { transform: scale(0.96); }
  #spin:disabled { filter: saturate(0.5) brightness(0.8); cursor: default; }
  #result {
    position: absolute;
    left: 0;
    right: 0;
    top: 772px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(243, 220, 154, 0.7);
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
  <div id="stage">
    <div id="art"></div>
    <canvas id="gl"></canvas>
    <div id="over"></div>
    <div class="ui" id="ui"></div>
    <button id="spin" type="button">SPIN</button>
    <div id="result"></div>
  </div>
  <script type="module" src="./reels.js"></script>
</body>
</html>
