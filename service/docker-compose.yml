services:
    # NATS service
    knats:
        environment:
            - TZ=Europe/Kyiv
        build:
            context: ./nats
            dockerfile: Dockerfile
            network: host
        network_mode: "host"
        ports:
            - "4222:4222"
        volumes:
            - ./nats/storage:/app/storage
        container_name: knats
        restart: "always"

    kusers:
        environment:
            - TZ=Europe/Kyiv
        build:
            context: ./user_manager
            dockerfile: Dockerfile
            network: host
        network_mode: "host"
        ports:
            - "23100:23100"
        volumes:
            - ./user_manager/logs:/app/logs
        container_name: kusers
        restart: "always"
        depends_on:
            knats:
                condition: service_started

    ktournaments:
        environment:
            - TZ=Europe/Kyiv
        build:
            context: ./k_tournaments
            dockerfile: Dockerfile
            network: host
        network_mode: "host"
        ports:
            - "23101:23101"
        volumes:
            - ./k_tournaments/logs:/app/logs
        container_name: ktournaments
        restart: "always"
        depends_on:
            knats:
                condition: service_started

    kgames:
        environment:
            - TZ=Europe/Kyiv
        build:
            context: ./games_manager
            dockerfile: Dockerfile
            network: host
        network_mode: "host"
